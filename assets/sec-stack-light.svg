<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120"><style>
.t{font-family:Georgia,'Times New Roman',serif}
.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;letter-spacing:3px}
.d{stroke-dasharray:2600;stroke-dashoffset:2600;animation:draw 3.2s cubic-bezier(.6,0,.2,1) forwards}
.d2{animation-delay:.35s}.d3{animation-delay:.7s}
.s{stroke-dasharray:140;stroke-dashoffset:140;animation:draw 2s ease forwards 2.6s,drift 6s ease-in-out infinite 4.6s}
.sun{opacity:0;animation:rise 1.6s ease forwards 1.3s}
.f{opacity:0;animation:in 1s ease forwards}
.tp{stroke-dasharray:6 8;animation:flow 40s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes in{to{opacity:1}}
@keyframes drift{50%{transform:translateX(6px)}}
@keyframes flow{to{stroke-dashoffset:-280}}
@keyframes pulse{50%{opacity:.35}}
</style>
